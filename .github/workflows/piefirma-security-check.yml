name: Check signature generator input safety
on:
  pull_request:
    paths:
      - "piefirma/**"
      - "scripts/test-piefirma-safe.mjs"
      - ".github/workflows/piefirma-security-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/test-piefirma-safe.mjs

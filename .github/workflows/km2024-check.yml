name: Validate legacy KM2024 links
on:
  pull_request:
    paths:
      - "KM2024.html"
      - ".github/workflows/km2024-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const page=readFileSync("KM2024.html","utf8");
          assert.ok(page.includes('lang="es"'));
          assert.ok(page.includes("VII Jornada de Gestión del Conocimiento"));
          assert.equal(page.includes('/edit"'),false);
          assert.equal(page.split("Enlace público de consulta pendiente de verificación.").length-1,2);
          console.log("KM2024: editor links removed, public reading links require review.");
          NODE

name: Validate Eleventy prototype (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: prototype
      - name: Build
        run: npm run build
        working-directory: prototype
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Local validation is the default; no PR-triggered Actions.
      # Permanent route, theme, link, contract and publication-safety tests
      # are included in npm run check; historical tests run only on demand.
      - name: Check publication safety
        run: npm run check:publish
        working-directory: prototype
      - name: Upload static review artifact (manual only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: eleventy-bilingual-preview
          path: prototype/dist/
          if-no-files-found: error
          retention-days: 14

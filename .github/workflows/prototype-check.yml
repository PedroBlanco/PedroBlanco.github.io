name: Validate bilingual prototype
on:
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: prototype
      - name: Build
        run: npm run build
        working-directory: prototype
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check routes
        run: npm run check
        working-directory: prototype
      - name: Inspect requested legacy PDF without exposing its content in logs
        run: |
          python -m pip install --disable-pip-version-check "pypdf>=5,<7"
          python prototype/scripts/audit-legacy-pdf.py
          python prototype/scripts/audit-legacy-pdf.py NEXUM2024.pdf
          python prototype/scripts/audit-legacy-pdf.py revista/2024-09-23_presentacion_revista.pdf
          python prototype/scripts/audit-legacy-pptx.py
      - name: Inspect owner-produced video (metadata only)
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python prototype/scripts/audit-legacy-video.py
      - name: Upload static review artifact
        uses: actions/upload-artifact@v4
        with:
          name: eleventy-bilingual-preview
          path: prototype/dist/
          if-no-files-found: error
          retention-days: 14
